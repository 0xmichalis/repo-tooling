name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and release.
        required: true

permissions:
  contents: read

jobs:
  release:
    uses: 0xmichalis/repo-tooling/.github/workflows/rust-binary-release.yml@bb4f2db0ec44c77fa32c4bd4a7125b432b94b21b
    permissions:
      contents: write
    with:
      binary: my-server
      tag: ${{ inputs.tag || github.ref_name }}
      targets: |
        [
          {"target":"x86_64-unknown-linux-musl","os":"ubuntu-latest","builder":"cross"},
          {"target":"aarch64-apple-darwin","os":"macos-latest","builder":"cargo"},
          {"target":"x86_64-apple-darwin","os":"macos-latest","builder":"cargo"}
        ]
