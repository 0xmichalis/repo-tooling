name: Rust binary release

on:
  workflow_call:
    inputs:
      binary:
        description: Cargo binary name to build and release.
        type: string
        required: true
      tag:
        description: Release tag in vMAJOR.MINOR.PATCH format.
        type: string
        required: true
      targets:
        description: JSON array of target, os and builder (cargo or cross) objects.
        type: string
        default: '[{"target":"x86_64-unknown-linux-musl","os":"ubuntu-latest","builder":"cross"}]'
      working-directory:
        description: Directory containing Cargo.toml, Cargo.lock, README.md and LICENSE.
        type: string
        default: .
      publish-release:
        description: Publish a release from the tag; false builds the caller commit and only uploads artifacts.
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.targets) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Validate release tag and builder
        working-directory: .
        env:
          BUILDER: ${{ matrix.builder }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "refusing to release a tag that is not vMAJOR.MINOR.PATCH: $RELEASE_TAG" >&2
            exit 1
          fi
          case "$BUILDER" in
            cargo|cross) ;;
            *) echo "builder must be cargo or cross: $BUILDER" >&2; exit 1 ;;
          esac

      # Release builds always check out the tag, including on workflow_dispatch.
      # Build-only callers validate their current commit without creating a tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.publish-release && inputs.tag || github.sha }}
          persist-credentials: false

      - name: Install Rust
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"
          rustup show

      # cross supplies the C compiler and cmake needed by musl TLS dependencies.
      - name: Install cross
        if: matrix.builder == 'cross'
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cross

      - name: Build binary
        env:
          BINARY: ${{ inputs.binary }}
          BUILDER: ${{ matrix.builder }}
          TARGET: ${{ matrix.target }}
        run: '"$BUILDER" build --release --locked --bin "$BINARY" --target "$TARGET"'

      - name: Package binary and checksum
        id: package
        uses: 0xmichalis/repo-tooling/actions/package-rust-binary@e0c6fd33b28d62d4c2361c4bb233f43a6058377a
        with:
          binary: ${{ inputs.binary }}
          tag: ${{ inputs.tag }}
          target: ${{ matrix.target }}
          working-directory: ${{ inputs.working-directory }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.binary }}-${{ matrix.target }}
          path: |
            ${{ inputs.working-directory }}/${{ steps.package.outputs.archive }}
            ${{ inputs.working-directory }}/${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: inputs.publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.binary }}-*
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag }}
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/${{ inputs.binary }}-*.tar.gz
            artifacts/${{ inputs.binary }}-*.tar.gz.sha256
