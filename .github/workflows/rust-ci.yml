name: Rust CI

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing Cargo.toml and Cargo.lock.
        type: string
        default: .
      run-tests:
        description: Run cargo test; disable when the caller owns coverage or integration tests.
        type: boolean
        default: true
      run-deny:
        description: Run cargo-deny using the caller's dependency policy.
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  # Shared tool versions and the checksum of cargo-sort's upstream release.
  CARGO_SORT_VERSION: "2.1.4"
  CARGO_SORT_SHA256: "c35c3df1f2e512890ee2ffd6151aa265fbfe06accbea0d9226e0bb14d821845b"
  CARGO_DENY_VERSION: "0.19.8"

jobs:
  fmt:
    name: Check Format
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Rust
      run: |
        rustup show active-toolchain || rustup toolchain install
        rustup component add rustfmt
        rustup show

    - name: Install cargo-sort
      run: |
        set -euo pipefail
        cargo_sort_bin_dir="${{ runner.tool_cache }}/cargo-sort/bin"
        cargo_sort_archive="$RUNNER_TEMP/cargo-sort.tar.gz"
        mkdir -p "$cargo_sort_bin_dir"
        curl -fsSL --retry 3 -o "$cargo_sort_archive" \
          "https://github.com/DevinR528/cargo-sort/releases/download/v${CARGO_SORT_VERSION}/cargo-sort-x86_64-unknown-linux-gnu.tar.gz"
        echo "${CARGO_SORT_SHA256}  ${cargo_sort_archive}" | sha256sum -c -
        tar -xzf "$cargo_sort_archive" -C "$cargo_sort_bin_dir" cargo-sort
        echo "$cargo_sort_bin_dir" >> "$GITHUB_PATH"

    - name: Check Format
      run: cargo fmt --all -- --check

    - name: Check cargo sort
      run: cargo sort --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Rust
      run: |
        rustup show active-toolchain || rustup toolchain install
        rustup component add clippy
        rustup show

    - name: Cache build artifacts
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ${{ inputs.working-directory }}/target
        key: ${{ runner.os }}-cargo-build-${{ hashFiles(format('{0}/**/Cargo.lock', inputs.working-directory)) }}

    - name: Clippy
      run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  check:
    name: Check
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Rust
      run: |
        rustup show active-toolchain || rustup toolchain install
        rustup show

    - name: Cache build artifacts
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ${{ inputs.working-directory }}/target
        key: ${{ runner.os }}-cargo-build-${{ hashFiles(format('{0}/**/Cargo.lock', inputs.working-directory)) }}

    - name: Cargo check
      run: cargo check --locked --workspace --all-targets --all-features

  test:
    name: Run Tests
    if: inputs.run-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Rust
      run: |
        rustup show active-toolchain || rustup toolchain install
        rustup show

    - name: Cache build artifacts
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ${{ inputs.working-directory }}/target
        key: ${{ runner.os }}-cargo-build-${{ hashFiles(format('{0}/**/Cargo.lock', inputs.working-directory)) }}

    - name: Run tests
      run: cargo test --locked --workspace --all-features

  deny:
    name: Cargo Deny
    if: inputs.run-deny
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Rust
      run: |
        rustup show active-toolchain || rustup toolchain install
        rustup show

    - name: Cache cargo registry and git
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-deps-${{ hashFiles(format('{0}/**/Cargo.lock', inputs.working-directory)) }}

    - name: Cache cargo-deny binary
      id: cache-cargo-deny
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.tool_cache }}/cargo-deny
        key: cargo-deny-bin-${{ env.CARGO_DENY_VERSION }}-rust1.88.0

    - name: Add cargo-deny to PATH
      run: echo "${{ runner.tool_cache }}/cargo-deny/bin" >> "$GITHUB_PATH"

    - name: Install cargo-deny
      if: steps.cache-cargo-deny.outputs.cache-hit != 'true'
      run: |
        rustup toolchain install 1.88.0 --profile minimal
        cargo +1.88.0 install --root "${{ runner.tool_cache }}/cargo-deny" --version "$CARGO_DENY_VERSION" --locked cargo-deny

    - name: Run cargo deny
      run: cargo deny --locked --workspace --all-features check bans licenses sources
