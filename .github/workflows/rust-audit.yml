name: Rust Security Audit

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing Cargo.lock on the default branch.
        type: string
        default: .
      deny-config:
        description: Optional cargo-deny configuration supplying advisory ignores.
        type: string
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: repo-tooling-rust-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: 0xmichalis/repo-tooling/actions/rust-audit@5a7433f0f8548dced1086d28bb1e0d8a15acb150
        with:
          working-directory: ${{ inputs.working-directory }}
          deny-config: ${{ inputs.deny-config }}
          token: ${{ github.token }}
