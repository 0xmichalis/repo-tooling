name: Node CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Node version supported by the caller.
        required: true
        type: string
      working-directory:
        description: Directory containing package.json and pnpm-lock.yaml.
        type: string
        default: .
      format-script:
        description: Package script for formatting checks.
        type: string
        default: format:check
      typecheck-script:
        description: Package script for type checks.
        type: string
        default: type-check
      test-script:
        description: Optional package script for tests.
        type: string
        default: ""
      build-script:
        description: Package script for the build; empty skips it.
        type: string
        default: build

permissions:
  contents: read

jobs:
  build:
    name: Node checks
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: 0xmichalis/repo-tooling/actions/setup-node@78be7e03543cc551812bddc42ae01de122f2d161
        with:
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}

      - name: Check formatting
        env:
          FORMAT_SCRIPT: ${{ inputs.format-script }}
        run: pnpm run "$FORMAT_SCRIPT"

      - name: Run linter
        run: pnpm lint

      - name: Check types
        env:
          TYPECHECK_SCRIPT: ${{ inputs.typecheck-script }}
        run: pnpm run "$TYPECHECK_SCRIPT"

      - name: Run tests
        if: inputs.test-script != ''
        env:
          TEST_SCRIPT: ${{ inputs.test-script }}
        run: pnpm run "$TEST_SCRIPT"

      - name: Build project
        if: inputs.build-script != ''
        env:
          BUILD_SCRIPT: ${{ inputs.build-script }}
        run: pnpm run "$BUILD_SCRIPT"
