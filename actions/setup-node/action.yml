name: Set up Node dependencies
description: Install the caller's Node version and locked npm or pnpm dependencies.

inputs:
  node-version:
    description: Node version supported by the caller.
    required: true
  package-manager:
    description: npm or pnpm; pnpm's version comes from package.json.
    default: pnpm
  working-directory:
    description: Directory containing package.json and the lockfile.
    default: .
  install-dependencies:
    description: Set to false for jobs that only need the package manager.
    default: "true"
  ignore-scripts:
    description: Disable dependency lifecycle scripts during installation.
    default: "false"

runs:
  using: composite
  steps:
    - name: Validate setup inputs
      shell: bash
      env:
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
        INSTALL_DEPENDENCIES: ${{ inputs.install-dependencies }}
        IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
      run: |
        case "$PACKAGE_MANAGER" in npm|pnpm) ;; *) exit 1 ;; esac
        case "$INSTALL_DEPENDENCIES" in true|false) ;; *) exit 1 ;; esac
        case "$IGNORE_SCRIPTS" in true|false) ;; *) exit 1 ;; esac

    - name: Set up pnpm
      if: inputs.package-manager == 'pnpm'
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      with:
        package_json_file: ${{ inputs.working-directory }}/package.json

    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.package-manager }}
        cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}

    - name: Install locked dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
        IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
      run: |
        flags=()
        if [[ "$IGNORE_SCRIPTS" == true ]]; then
          flags+=(--ignore-scripts)
        fi
        if [[ "$PACKAGE_MANAGER" == pnpm ]]; then
          pnpm install --frozen-lockfile "${flags[@]}"
        else
          npm ci "${flags[@]}"
        fi
